services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - redis-cluster-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server kafka:29092 || exit 1
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s
    networks:
      - redis-cluster-net

  go-server:
    build:
      context: .
      dockerfile: go-server/Dockerfile
    ports:
      - "${GRPC_HOST_PORT:-50051}:50051"
      - "${SERVER_METRICS_HOST_PORT:-9100}:9100"
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS_CLUSTER_ADDRS=${REDIS_NODE1_IP:-192.168.241.100}:6379,${REDIS_NODE2_IP:-192.168.241.101}:6379,${REDIS_NODE3_IP:-192.168.241.102}:6379
      - REDIS_DIAL_TIMEOUT_MS=${REDIS_DIAL_TIMEOUT_MS:-}
      - REDIS_READ_TIMEOUT_MS=${REDIS_READ_TIMEOUT_MS:-}
      - REDIS_WRITE_TIMEOUT_MS=${REDIS_WRITE_TIMEOUT_MS:-}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-}
      - REDIS_MAX_RETRIES=${REDIS_MAX_RETRIES:-}
      - REDIS_MIN_RETRY_BACKOFF_MS=${REDIS_MIN_RETRY_BACKOFF_MS:-}
      - REDIS_MAX_RETRY_BACKOFF_MS=${REDIS_MAX_RETRY_BACKOFF_MS:-}
    depends_on:
      kafka:
        condition: service_started
      redis-cluster-setup:
        condition: service_completed_successfully
    networks:
      - redis-cluster-net

  python-producer:
    build:
      context: .
      dockerfile: python-producer/Dockerfile
    environment:
      - GRPC_SERVER_ADDRESS=go-server:50051
      - TRAFFIC_SEED=${TRAFFIC_SEED:-20261010}
      - TRAFFIC_INTERVAL_SECONDS=${TRAFFIC_INTERVAL_SECONDS:-0.2}
      - TRAFFIC_FRAUD_PROBABILITY=${TRAFFIC_FRAUD_PROBABILITY:-0.05}
      - TRAFFIC_USER_LIMIT=${TRAFFIC_USER_LIMIT:-50}
    depends_on:
      - go-server
    networks:
      - redis-cluster-net
  
  go-enricher:
    build:
      context: .
      dockerfile: go-enricher/Dockerfile
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_CONSUMER_TOPICS_ENRICHER=raw_transactions
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-fraud-enricher}
      - KAFKA_OFFSET_RESET=${KAFKA_OFFSET_RESET:-earliest}
      - REDIS_CLUSTER_ADDRS=${REDIS_NODE1_IP:-192.168.241.100}:6379,${REDIS_NODE2_IP:-192.168.241.101}:6379,${REDIS_NODE3_IP:-192.168.241.102}:6379
      - REDIS_DIAL_TIMEOUT_MS=${REDIS_DIAL_TIMEOUT_MS:-}
      - REDIS_READ_TIMEOUT_MS=${REDIS_READ_TIMEOUT_MS:-}
      - REDIS_WRITE_TIMEOUT_MS=${REDIS_WRITE_TIMEOUT_MS:-}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-}
      - REDIS_MAX_RETRIES=${REDIS_MAX_RETRIES:-}
      - REDIS_MIN_RETRY_BACKOFF_MS=${REDIS_MIN_RETRY_BACKOFF_MS:-}
      - REDIS_MAX_RETRY_BACKOFF_MS=${REDIS_MAX_RETRY_BACKOFF_MS:-}
    depends_on:
      kafka:
        condition: service_started
      redis-cluster-setup:
        condition: service_completed_successfully
      geoip-updater:
        condition: service_started
        required: false
    networks:
      - redis-cluster-net
    volumes:
      # GeoIP source: the MaxMind volume filled by geoip-updater (profile
      # "geoip", needs .env credentials), or GEOIP_DATA=./tests/fixtures/geoip
      # for record-free test databases that need no credentials.
      - ${GEOIP_DATA:-geoip-data}:/data/geoip:ro
    restart: on-failure

  redis1:
    image: redis:8.4.0
    command: >
      redis-server --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --port 6379
      --bind 0.0.0.0 --protected-mode no
    ports:
      - "${REDIS1_HOST_PORT:-7011}:6379"
      - "${REDIS1_BUS_HOST_PORT:-17011}:16379"
    networks:
      redis-cluster-net:
        ipv4_address: ${REDIS_NODE1_IP:-192.168.241.100}
    restart: always

  redis2:
    image: redis:8.4.0
    command: >
      redis-server --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --port 6379
      --bind 0.0.0.0 --protected-mode no
    ports:
      - "${REDIS2_HOST_PORT:-7012}:6379"
      - "${REDIS2_BUS_HOST_PORT:-17012}:16379"
    networks:
      redis-cluster-net:
        ipv4_address: ${REDIS_NODE2_IP:-192.168.241.101}
    restart: always

  redis3:
    image: redis:8.4.0
    command: >
      redis-server --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --port 6379
      --bind 0.0.0.0 --protected-mode no
    ports:
      - "${REDIS3_HOST_PORT:-7013}:6379"
      - "${REDIS3_BUS_HOST_PORT:-17013}:16379"
    networks:
      redis-cluster-net:
        ipv4_address: ${REDIS_NODE3_IP:-192.168.241.102}
    restart: always

  redis-cluster-setup:
    image: redis:8.4.0
    depends_on:
      - redis1
      - redis2
      - redis3
    entrypoint: >
      sh -c "
      sleep 30 &&
      if redis-cli -h ${REDIS_NODE1_IP:-192.168.241.100} -p 6379 cluster info | grep -q 'cluster_state:ok'; then
        echo 'Cluster already healthy, skipping creation.';
      else
        echo yes | redis-cli --cluster create ${REDIS_NODE1_IP:-192.168.241.100}:6379 ${REDIS_NODE2_IP:-192.168.241.101}:6379 ${REDIS_NODE3_IP:-192.168.241.102}:6379 --cluster-replicas 0;
      fi
      "
    networks:
      redis-cluster-net:
        ipv4_address: ${REDIS_SETUP_IP:-192.168.241.103}

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - redis-cluster-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    command:
      - "--redis.addr=redis://redis1:6379"
      - "--is-cluster"
    ports:
      - "${REDIS_EXPORTER_HOST_PORT:-9121}:9121"
    depends_on:
      redis-cluster-setup:
        condition: service_completed_successfully
    networks:
      - redis-cluster-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "${KAFKA_EXPORTER_HOST_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - redis-cluster-net

  geoip-updater:
    image: maxmindinc/geoipupdate:v7.1.1
    profiles: ["geoip"]
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=${GEOIPUPDATE_EDITION_IDS}
      - GEOIPUPDATE_FREQUENCY=${GEOIPUPDATE_FREQUENCY}
    volumes:
      - geoip-data:/usr/share/GeoIP
    restart: unless-stopped

networks:
  redis-cluster-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
    ipam:
      config:
        - subnet: ${REDIS_SUBNET:-192.168.241.0/24}
          gateway: ${REDIS_GATEWAY:-192.168.241.1}

volumes:
  geoip-data:
