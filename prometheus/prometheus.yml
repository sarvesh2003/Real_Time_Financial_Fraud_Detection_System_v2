global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'go-server'
    static_configs:
      - targets: ['go-server:9100']

  - job_name: 'go-enricher'
    # go-enricher can run as multiple replicas sharing one DNS name.
    # static_configs would only ever resolve to whichever single replica
    # Docker's embedded DNS happens to hand back, silently hiding the
    # others' counters. dns_sd_configs resolves every A record behind the
    # name and scrapes each replica individually.
    dns_sd_configs:
      - names: ['go-enricher']
        type: 'A'
        port: 9101
