global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'go-server'
    static_configs:
      - targets: ['go-server:9100']

  - job_name: 'go-enricher'
    static_configs:
      - targets: ['go-enricher:9101']
