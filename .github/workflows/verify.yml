name: Verify local contracts

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pipeline images on Linux
        run: docker compose build go-server go-enricher python-producer
      - name: Check Go packages in Linux images
        run: |
          docker compose run --rm --no-deps --entrypoint go go-server test -tags musl ./go-server ./pb/... ./internal/...
          docker compose run --rm --no-deps --entrypoint go go-enricher test -tags musl ./go-enricher ./pb/... ./internal/...
      - name: Load saved synthetic model and create a valid request
        run: docker compose run --rm --no-deps --entrypoint python python-producer -c "from traffic import TransactionGenerator; r = TransactionGenerator(20261010).make_request(); assert r.transaction_id and r.user_id and r.amount >= 0"
      - name: Test Redis Lua and V2 scoring contracts
        run: python -m unittest tests.test_redis_window tests.test_rate_limit tests.test_agent_contract tests.test_v2_scoring tests.test_experiment_stack -v

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluator dependencies
        run: python -m pip install -r eval/requirements.txt
      - name: Check evaluator behavior
        run: python -m unittest discover -s eval/semantic_eval/tests -t . -q

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph dependencies
        run: python -m pip install langgraph
      - name: Check investigation control flow
        run: python -m unittest tests.test_agent_graph -v

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCP dependencies
        run: python -m pip install -r mcp-server/requirements.txt
      - name: Check current metric visibility
        run: python -m unittest tests.test_mcp_metrics -v
